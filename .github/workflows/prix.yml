name: Prix Cardmarket et TCGplayer

# Chaque nuit : prix du jour publiés sur la branche « prix », lue par l'app.
#   cardmarket.json : prix/sync-cardmarket.mjs (guide de prix public de Cardmarket, en euros) ;
#   tcgplayer.json  : prix/sync-tcgplayer.mjs (TCGCSV, copie publique des données de TCGplayer, en dollars), ajouté le 20/10/2026.
# Une source en panne n'empêche pas l'autre d'être publiée (la tâche finit quand même en échec pour prévenir).
# Déménagé du dépôt de la 1.1 (PommeSauce0/CyberCardex, branche data) le 19/10/2026.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prix

jobs:
  prix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions épinglées par empreinte (SHA).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prix publiés la veille
        run: |
          git fetch --depth=1 origin prix
          for f in cardmarket tcgplayer; do
            # tcgplayer.json n'existe pas avant la première publication : on part de rien.
            git show "FETCH_HEAD:$f.json" > "$RUNNER_TEMP/$f.json" 2>/dev/null || rm -f "$RUNNER_TEMP/$f.json"
            cp "$RUNNER_TEMP/$f.json" "$RUNNER_TEMP/$f.before.json" 2>/dev/null || true
          done
          echo "PARENT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Prix Cardmarket du jour (avec vérifications)
        id: cardmarket
        continue-on-error: true
        run: node prix/sync-cardmarket.mjs --out "$RUNNER_TEMP/cardmarket.json"

      - name: Prix TCGplayer du jour (avec vérifications)
        id: tcgplayer
        continue-on-error: true
        run: node prix/sync-tcgplayer.mjs --out "$RUNNER_TEMP/tcgplayer.json"

      - name: Publier sur la branche prix
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # On repart des fichiers déjà sur prix et on ne remplace que les prix qui ont changé.
          export GIT_INDEX_FILE="$RUNNER_TEMP/prix-index"
          git read-tree "$PARENT"
          changed=""
          for f in cardmarket tcgplayer; do
            [ -f "$RUNNER_TEMP/$f.json" ] || continue
            cmp -s "$RUNNER_TEMP/$f.before.json" "$RUNNER_TEMP/$f.json" && continue
            blob=$(git hash-object -w "$RUNNER_TEMP/$f.json")
            git update-index --add --cacheinfo "100644,$blob,$f.json"
            date=$(node -p "require(process.argv[1]).updatedAt.slice(0, 10)" "$RUNNER_TEMP/$f.json")
            changed="$changed $f du $date"
          done
          if [ -z "$changed" ]; then
            echo "Prix inchangés : rien à publier."
          else
            tree=$(git write-tree)
            commit=$(git commit-tree "$tree" -p "$PARENT" -m "Prix :$changed")
            git push origin "$commit:refs/heads/prix"
          fi

      - name: Prévenir si une source a échoué
        if: steps.cardmarket.outcome == 'failure' || steps.tcgplayer.outcome == 'failure'
        run: |
          echo "Cardmarket : ${{ steps.cardmarket.outcome }} ; TCGplayer : ${{ steps.tcgplayer.outcome }}"
          exit 1
